site_name: Zigbee2MQTT for Mere Mortals
site_description: Bringing Zigbee bulbs and sensors into MQTT and Home Assistant without a vendor hub. One USB coordinator, one bridge program and one small broker replace a shelf of branded hubs and cloud accounts, with the startup logs shown honestly and the limits stated plainly.
